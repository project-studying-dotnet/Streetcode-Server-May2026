services:
  email-service:
    build:
      context: ./Streetcode
      dockerfile: Streetcode.EmailService/Dockerfile
    container_name: streetcode-email-service
    ports:
      - "5190:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      EmailConfiguration__From: ${EmailConfiguration__From}
      EmailConfiguration__SmtpServer: ${EmailConfiguration__SmtpServer}
      EmailConfiguration__Port: ${EmailConfiguration__Port}
      EmailConfiguration__UserName: ${EmailConfiguration__UserName}
      EmailConfiguration__Password: ${EmailConfiguration__Password}

      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RabbitMq__UserName}
      RabbitMq__Password: ${RabbitMq__Password}
      RabbitMq__QueueName: email-queue

      ConnectionStrings__HangfireConnection: ${HangfireConnection}
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    container_name: streetcode-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"