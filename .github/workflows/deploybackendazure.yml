name: Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/252/Deploy-backend-applicatio-to-Azure

env:
  AZURE_WEBAPP_NAME: 'backend-streetcode-may-2026'
  AZURE_WEBAPP_PACKAGE_PATH: './Streetcode/Streetcode.WebApi/publish'
  DOTNET_VERSION: '10.x'
  SOLUTION_PATH: './Streetcode/Streetcode.slnx'
  API_PROJECT_PATH: './Streetcode/Streetcode.WebApi'
  PUBLISH_DIR: './publish'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check Docker
        run: docker version

      - name: Install SonarScanner
        run: dotnet tool update --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"project-studying-dotnet_Streetcode-Server-May2026"
          /o:"project-studying-dotnet"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage/**/*.opencover.xml"
          /d:sonar.coverage.exclusions="**/Program.cs,**/Streetcode.DAL/Persistence/Configurations/**/*.cs,**/Streetcode.DAL/Persistence/StreetcodeDbContext.cs"
          /d:sonar.exclusions="**/.github/**,**/*.yml,**/*.yaml,**/Streetcode.DAL/Persistence/Configurations/**/*.cs,**/Streetcode.DAL/Persistence/Migrations/**/*.cs"

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} 
          --configuration Release 
          --no-restore

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION_PATH }} 
          --configuration Release
          --no-restore
          --no-build 
          --verbosity normal

      - name: Run integration tests with coverage
        run: >
          dotnet test ./Streetcode/Streetcode.XIntegrationTest/Streetcode.XIntegrationTest.csproj
          --configuration Release
          --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput="${{ github.workspace }}/coverage/integration/coverage.opencover.xml"

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner end
          /d:sonar.token="${SONAR_TOKEN}"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          
      - name: Publish application
        run: dotnet publish ${{ env.API_PROJECT_PATH }} 
          --configuration Release 
          --no-restore 
          --no-build 
          --property:PublishDir=${{ env.PUBLISH_DIR }}

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    name: Deploy to Azure
    runs-on: windows-latest
    needs: [build-and-test]

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
