name: Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/252/Deploy-backend-applicatio-to-Azure

env:
  AZURE_WEBAPP_NAME: 'backend-streetcode-may-2026'
  AZURE_WEBAPP_PACKAGE_PATH: './Streetcode/Streetcode.WebApi/publish'
  DOTNET_VERSION: '10.x'
  SOLUTION_PATH: './Streetcode/Streetcode.slnx'
  API_PROJECT_PATH: './Streetcode/Streetcode.WebApi'
  PUBLISH_DIR: './publish'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --c Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION_PATH }} --c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Publish application
        run: dotnet publish ${{ env.API_PROJECT_PATH }} --c Release --no-restore --no-build --o ${{ env.PUBLISH_DIR }}

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    name: Deploy to Azure
    runs-on: windows-latest
    needs: [build-and-test]

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}