name: SonarCloud

on:
  push:
    branches:
      - master
      - develop
      - dev
      - main
  pull_request:
    branches:
      - master
      - develop
      - dev
      - main
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud_branch:
    name: SonarCloud analysis
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Install SonarScanner
        run: dotnet tool update --global dotnet-sonarscanner

      - name: Restore Dependencies
        run: dotnet restore ./Streetcode/Streetcode.sln

      - name: SonarScanner Begin
        run: >
          dotnet sonarscanner begin
          /k:"ita-social-projects_StreetCode"
          /o:"ita-social-projects"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="coverage/coverage.opencover.xml"

      - name: Build
        run: >
          dotnet build ./Streetcode/Streetcode.sln
          --configuration Release
          --no-restore
          /p:TreatWarningsAsErrors=false

      - name: Test and Code Coverage
        run: >
          dotnet test ./Streetcode/Streetcode.XUnitTest/Streetcode.XUnitTest.csproj
          --configuration Release
          --no-build
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput=../../coverage/coverage.opencover.xml

      - name: SonarScanner End
        run: >
          dotnet sonarscanner end
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Publish Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/