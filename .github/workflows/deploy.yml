name: Backend CI/CD (Docker)

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push ApiGateway
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/streetcode-apigateway:latest -f ./Streetcode.ApiGateway/Dockerfile .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/streetcode-apigateway:latest

      - name: Deploy to DEV App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'streetcode-may2026-backend'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_DEV }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/streetcode-apigateway:latest'